spring.application.name=shareguard
server.port=8080

logging.level.root=INFO
logging.level.mari.samba=DEBUG

# AUTO uses local execution when a local password is configured, otherwise SSH.
shareguard.execution.mode=AUTO
shareguard.execution.local-username=admin
shareguard.execution.local-password=${SHAREGUARD_EXECUTION_LOCAL_PASSWORD:}
shareguard.execution.command-timeout=30s
shareguard.execution.helper-socket=/run/shareguard/helper.sock
