<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Состав группы - Samba Web UI')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar('groups')}"></div>

<div class="container-fluid mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h5 class="card-title mb-0 fw-bold">
                        <i class="fas fa-users text-primary me-2"></i>Состав группы: <span class="text-primary" th:text="${group.name}"></span>
                    </h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/groups/{name}/members(name=${group.name})}" method="post">
                        
                        <div class="mb-4">
                            <p class="text-muted small">Выберите пользователей, которые должны состоять в этой группе. Снимите галочки с тех, кого нужно исключить.</p>
                            
                            <div class="list-group">
                                <label th:each="user : ${allUsers}" class="list-group-item d-flex gap-2">
                                    <input class="form-check-input flex-shrink-0" type="checkbox" name="members" 
                                           th:value="${user.username}" 
                                           th:checked="${group.members != null and group.members.contains(user.username)}">
                                    <span>
                                        <i class="fas fa-user-circle text-secondary me-1"></i>
                                        <span th:text="${user.username}" class="fw-medium"></span>
                                        <small class="d-block text-muted" th:text="${user.fullName}"></small>
                                    </span>
                                </label>
                                <div th:if="${allUsers == null or allUsers.empty}" class="text-muted text-center py-3">
                                    В системе пока нет пользователей. Сначала <a th:href="@{/users/create}">создайте пользователя</a>.
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/groups}" class="btn btn-secondary px-4 rounded-pill">Назад</a>
                            <button type="submit" class="btn btn-primary px-4 rounded-pill" th:disabled="${allUsers == null or allUsers.empty}">
                                <i class="fas fa-save me-1"></i> Сохранить состав
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
