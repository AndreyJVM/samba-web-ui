<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Смена пароля — Samba Web UI')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar('users')}"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card">
                <div class="card-header p-4">
                    <h5 class="mb-0 fw-bold">
                        <i class="fas fa-key text-warning me-2"></i>Смена пароля: <span class="text-primary" th:text="${username}"></span>
                    </h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/users/change-password/{username}(username=${username})}" method="post" id="pwdForm">
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">Новый пароль <span class="text-danger">*</span></label>
                            <input type="password" id="newPassword" name="newPassword" class="form-control" required minlength="6">
                        </div>
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">Повторите пароль <span class="text-danger">*</span></label>
                            <input type="password" id="confirmPassword" class="form-control" required>
                            <div id="mismatchAlert" class="text-danger small mt-1 d-none">
                                <i class="fas fa-exclamation-circle me-1"></i>Пароли не совпадают
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save me-2"></i>Сохранить</button>
                            <a href="/users" class="btn btn-outline-secondary px-4">Отмена</a>
                        </div>
                    </form>

                    <div th:if="${error}" class="alert alert-danger mt-3">
                        <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${error}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
    document.getElementById('pwdForm').addEventListener('submit', function(e) {
        const p1 = document.getElementById('newPassword').value;
        const p2 = document.getElementById('confirmPassword').value;
        const alertBox = document.getElementById('mismatchAlert');
        if (p1 !== p2) {
            e.preventDefault();
            alertBox.classList.remove('d-none');
        } else {
            alertBox.classList.add('d-none');
        }
    });
</script>
</body>
</html>
