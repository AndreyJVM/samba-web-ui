<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Смена пароля</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container" style="max-width: 500px; margin-top: 50px;">
    <h1>🔑 Смена пароля</h1>
    <p>Пользователь: <strong th:text="${username}"></strong></p>

    <form th:action="@{/users/change-password/{username}(username=${username})}" method="post">
        <div style="margin-bottom: 15px;">
            <label for="newPassword">Новый пароль:</label>
            <input type="password" id="newPassword" name="newPassword" class="form-control" required>
            <small style="color: #6c757d;">Минимум 6 символов</small>
        </div>

        <button type="submit" class="btn btn-primary">✅ Сменить пароль</button>
        <a href="/users" class="btn btn-secondary">⬅️ Отмена</a>
    </form>

    <div th:if="${error}" style="color: red; margin-top: 20px; background: #f8d7da; padding: 15px; border-radius: 4px;" th:text="${error}"></div>
</div>
</body>
</html>
