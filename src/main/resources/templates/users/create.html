<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-custom { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .navbar-custom .navbar-brand { color: white; font-weight: 600; }
        .navbar-custom .nav-link { color: rgba(255,255,255,0.85); }
        .navbar-custom .nav-link:hover { color: white; }
        .card { border-radius: 20px; border: none; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        .card-header { background: transparent; border-bottom: 2px solid #f0f0f0; font-weight: 600; }
        .form-control { border-radius: 12px; border: 2px solid #e9ecef; padding: 0.7rem 1rem; }
        .form-control:focus { border-color: #667eea; box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25); }
        .form-label { font-weight: 600; color: #495057; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; border-radius: 12px; padding: 0.6rem 2rem; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand" href="/shares"><i class="fas fa-server me-2"></i>Samba Web UI</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/shares"><i class="fas fa-folder-open"></i> Шары</a></li>
                <li class="nav-item"><a class="nav-link active" href="/users"><i class="fas fa-users"></i> Пользователи</a></li>
                <li class="nav-item"><a class="nav-link text-danger" href="/disconnect"><i class="fas fa-sign-out-alt"></i> Отключиться</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header p-4">
                    <h5 class="mb-0"><i class="fas fa-user-plus text-primary me-2"></i> Добавить нового пользователя</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/users/create}" th:object="${user}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Имя пользователя (логин) <span class="text-danger">*</span></label>
                            <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="smbuser" required>
                        </div>
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Полное имя (ФИО / Описание)</label>
                            <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="Иван Иванов">
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Пароль <span class="text-danger">*</span></label>
                            <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Минимум 6 символов" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary"><i class="fas fa-check me-2"></i>Создать</button>
                            <a href="/users" class="btn btn-outline-secondary"><i class="fas fa-times me-2"></i>Отмена</a>
                        </div>
                    </form>

                    <div th:if="${error}" class="alert alert-danger mt-3">
                        <i class="fas fa-exclamation-circle me-2"></i> <span th:text="${error}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
