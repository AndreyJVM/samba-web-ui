<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Новый пользователь — Samba Web UI')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar('users')}"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card">
                <div class="card-header p-4">
                    <h5 class="mb-0 fw-bold"><i class="fas fa-user-plus text-primary me-2"></i>Добавить пользователя</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/users/create}" th:object="${user}" method="post" id="createForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Логин <span class="text-danger">*</span></label>
                            <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="smbuser" required>
                        </div>
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Полное имя / Описание</label>
                            <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="Иван Иванов">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Пароль <span class="text-danger">*</span></label>
                            <input type="password" id="password" th:field="*{password}" class="form-control" required minlength="6">
                        </div>
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">Повторите пароль <span class="text-danger">*</span></label>
                            <input type="password" id="confirmPassword" class="form-control" required>
                            <div id="mismatchAlert" class="text-danger small mt-1 d-none">
                                <i class="fas fa-exclamation-circle me-1"></i>Пароли не совпадают
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4"><i class="fas fa-check me-2"></i>Создать</button>
                            <a href="/users" class="btn btn-outline-secondary px-4">Отмена</a>
                        </div>
                    </form>

                    <div th:if="${error}" class="alert alert-danger mt-3">
                        <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${error}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
    document.getElementById('createForm').addEventListener('submit', function(e) {
        const p1 = document.getElementById('password').value;
        const p2 = document.getElementById('confirmPassword').value;
        const alertBox = document.getElementById('mismatchAlert');
        if (p1 !== p2) {
            e.preventDefault();
            alertBox.classList.remove('d-none');
        } else {
            alertBox.classList.add('d-none');
        }
    });
</script>
</body>
</html>
