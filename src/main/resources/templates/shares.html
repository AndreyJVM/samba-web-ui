<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список шар Samba</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <h1>📂 Список общих папок (шар)</h1>
    <p>Сервер: <strong th:text="${sambaHost}"></strong></p>

    <table border="1" style="width: 100%; border-collapse: collapse;">
        <thead>
        <tr>
            <th>Имя</th>
            <th>Путь</th>
            <th>Комментарий</th>
            <th>Только чтение</th>
            <th>Гостевой доступ</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="share : ${shares}">
            <td th:text="${share.name}"></td>
            <td th:text="${share.path}"></td>
            <td th:text="${share.comment}"></td>
            <td th:text="${share.readOnly} ? 'Да' : 'Нет'"></td>
            <td th:text="${share.guestOk} ? 'Да' : 'Нет'"></td>
            <td>
                <a th:href="@{/shares/edit/{name}(name=${share.name})}">✏️</a>
                <a th:href="@{/shares/delete/{name}(name=${share.name})}">🗑️</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a href="/shares/create" class="btn btn-primary">➕ Добавить шару</a>
    <a href="/disconnect" class="btn btn-danger">🔌 Отключиться</a>
</div>
</body>
</html>
