<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="directoryBrowserModal" class="modal fade" id="dirBrowserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-light">
                <h5 class="modal-title fw-bold">
                    <i class="fas fa-folder-tree text-primary me-2"></i>Выбор каталога на сервере
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-3">

                <!-- Быстрые закладки -->
                <div class="d-flex flex-wrap gap-1 mb-2">
                    <span class="small text-muted align-self-center me-1">Перейти в:</span>
                    <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="loadDirectory('/')">/</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="loadDirectory('/srv')">/srv</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="loadDirectory('/mnt')">/mnt</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="loadDirectory('/home')">/home</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="loadDirectory('/media')">/media</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="loadDirectory('/var')">/var</button>
                </div>

                <!-- Текущий путь и кнопка вверх -->
                <div class="input-group mb-3">
                    <button class="btn btn-outline-secondary" type="button" id="btnGoUp" title="На уровень вверх">
                        <i class="fas fa-level-up-alt"></i> Вверх
                    </button>
                    <input type="text" id="browserCurrentPath" class="form-control font-monospace" readonly value="/">
                    <button class="btn btn-outline-primary" type="button" id="btnRefreshDir" title="Обновить">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>

                <!-- Список директорий -->
                <div class="border rounded bg-white" style="height: 300px; overflow-y: auto;">
                    <div id="dirSpinner" class="text-center p-4 d-none">
                        <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                        <span class="ms-2 small text-muted">Загрузка каталогов...</span>
                    </div>
                    <div class="list-group list-group-flush" id="dirListContainer">
                        <!-- Динамические строки папок -->
                    </div>
                    <div id="emptyDirMsg" class="text-center p-4 text-muted small d-none">
                        <i class="far fa-folder-open fa-2x mb-2 d-block opacity-50"></i>
                        Вложенных папок нет
                    </div>
                </div>

                <!-- Создание новой папки -->
                <div class="mt-3 p-2 bg-light rounded border">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text"><i class="fas fa-folder-plus me-1"></i>Новая папка</span>
                        <input type="text" id="newDirInput" class="form-control" placeholder="имя_новой_папки">
                        <button class="btn btn-outline-success" type="button" id="btnCreateDir">
                            <i class="fas fa-plus"></i> Создать
                        </button>
                    </div>
                </div>

            </div>
            <div class="modal-footer bg-light border-0">
                <button type="button" class="btn btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary rounded-pill px-4" id="btnSelectCurrentDir">
                    <i class="fas fa-check me-1"></i> Выбрать этот каталог
                </button>
            </div>
        </div>
    </div>
</div>

<script th:fragment="directoryBrowserScript">
    let currentBrowserPath = '/';
    let parentBrowserPath = '/';
    let targetInputElement = null;

    function openDirectoryBrowser(targetInputId) {
        targetInputElement = document.getElementById(targetInputId);
        const initialPath = (targetInputElement && targetInputElement.value.trim().startsWith('/'))
            ? targetInputElement.value.trim()
            : '/srv';

        new bootstrap.Modal(document.getElementById('dirBrowserModal')).show();
        loadDirectory(initialPath);
    }

    function loadDirectory(path) {
        const spinner = document.getElementById('dirSpinner');
        const container = document.getElementById('dirListContainer');
        const emptyMsg = document.getElementById('emptyDirMsg');
        const pathField = document.getElementById('browserCurrentPath');

        spinner.classList.remove('d-none');
        container.innerHTML = '';
        emptyMsg.classList.add('d-none');

        fetch(`/api/fs/browse?path=${encodeURIComponent(path)}`)
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    alert('Ошибка: ' + data.error);
                    return;
                }
                currentBrowserPath = data.currentPath;
                parentBrowserPath = data.parentPath;
                pathField.value = currentBrowserPath;

                if (!data.directories || data.directories.length === 0) {
                    emptyMsg.classList.remove('d-none');
                } else {
                    data.directories.forEach(dir => {
                        const item = document.createElement('a');
                        item.href = 'javascript:void(0)';
                        item.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2';
                        item.innerHTML = `
                            <span><i class="fas fa-folder text-warning me-2"></i><strong>${dir.name}</strong></span>
                            <i class="fas fa-chevron-right text-muted small"></i>
                        `;
                        item.onclick = () => loadDirectory(dir.fullPath);
                        container.appendChild(item);
                    });
                }
            })
            .catch(err => {
                console.error(err);
                alert('Не удалось загрузить структуру каталогов');
            })
            .finally(() => {
                spinner.classList.add('d-none');
            });
    }

    document.getElementById('btnGoUp').addEventListener('click', () => {
        if (currentBrowserPath !== '/') {
            loadDirectory(parentBrowserPath);
        }
    });

    document.getElementById('btnRefreshDir').addEventListener('click', () => {
        loadDirectory(currentBrowserPath);
    });

    document.getElementById('btnSelectCurrentDir').addEventListener('click', () => {
        if (targetInputElement) {
            targetInputElement.value = currentBrowserPath;
        }
        const modalEl = document.getElementById('dirBrowserModal');
        const modal = bootstrap.Modal.getInstance(modalEl);
        if (modal) modal.hide();
    });

    document.getElementById('btnCreateDir').addEventListener('click', () => {
        const input = document.getElementById('newDirInput');
        const name = input.value.trim();
        if (!name) return;

        fetch(`/api/fs/mkdir?parentPath=${encodeURIComponent(currentBrowserPath)}&name=${encodeURIComponent(name)}`, {
            method: 'POST'
        })
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                alert('Ошибка создания папки: ' + data.error);
            } else {
                input.value = '';
                loadDirectory(currentBrowserPath);
            }
        })
        .catch(err => console.error(err));
    });
</script>

</body>
</html>
