<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Samba Web UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<div th:fragment="navbar(activeTab)">
    <!-- Шапка для мобилок -->
    <div class="mobile-header d-lg-none d-flex justify-content-between align-items-center p-3 shadow-sm text-white">
        <div class="fw-bold fs-5">
            <i class="fas fa-server me-2"></i>Samba UI
        </div>
        <button class="btn btn-outline-light border-0" type="button" onclick="document.getElementById('sidebar').classList.add('show'); document.getElementById('sidebar-backdrop').classList.add('show');">
            <i class="fas fa-bars fs-4"></i>
        </button>
    </div>

    <!-- Фон для мобилок -->
    <div class="sidebar-backdrop d-lg-none" id="sidebar-backdrop" onclick="document.getElementById('sidebar').classList.remove('show'); this.classList.remove('show');"></div>

    <!-- Сайдбар -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header d-flex justify-content-between align-items-center">
            <a href="/shares" class="sidebar-brand">
                <i class="fas fa-server"></i> Samba Web UI
            </a>
            <!-- Кнопка закрытия для мобилок -->
            <button type="button" class="btn-close btn-close-white d-lg-none" onclick="document.getElementById('sidebar').classList.remove('show'); document.getElementById('sidebar-backdrop').classList.remove('show');"></button>
        </div>

        <ul class="sidebar-nav">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeTab == 'shares'} ? ' active' : ''" href="/shares">
                    <i class="fas fa-folder-open"></i> Шары
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeTab == 'users'} ? ' active' : ''" href="/users">
                    <i class="fas fa-user"></i> Пользователи
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeTab == 'groups'} ? ' active' : ''" href="/groups">
                    <i class="fas fa-users"></i> Группы
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeTab == 'config'} ? ' active' : ''" href="/config">
                    <i class="fas fa-file-code"></i> Конфиг
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeTab == 'global-settings'} ? ' active' : ''" href="/config/global">
                    <i class="fas fa-sliders-h"></i> Опции
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeTab == 'status'} ? ' active' : ''" href="/status">
                    <i class="fas fa-heartbeat"></i> Мониторинг
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeTab == 'logs'} ? ' active' : ''" href="/logs">
                    <i class="fas fa-terminal"></i> Логи
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <div class="navbar-host-badge mb-3 text-truncate p-2 rounded" th:if="${session.sambaHost}" style="background-color: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);">
                <div class="d-flex align-items-center mb-1">
                    <i class="fas fa-network-wired me-2 mt-1" style="color: #64ffda;"></i>
                    <span th:text="${session.sambaHost}" class="fw-bold text-white fs-6"></span>
                </div>
                <div class="d-flex align-items-center" th:if="${session.sambaUser}">
                    <i class="fas fa-user-circle me-2 mt-1" style="color: #cbd5e1;"></i>
                    <span th:text="${session.sambaUser}" style="color: #f8fafc; font-weight: 500;"></span>
                </div>
            </div>
            
            <a class="btn btn-outline-light w-100" href="/disconnect">
                <i class="fas fa-sign-out-alt me-1"></i> Отключиться
            </a>
        </div>
    </div>
</div>

<footer th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</footer>
</html>
