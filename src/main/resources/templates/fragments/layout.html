<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Samba Web UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<nav th:fragment="navbar(activeTab)" class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand" href="/shares">
            <i class="fas fa-server me-2"></i>Samba Web UI
        </a>
        <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#topNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="topNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'shares'} ? ' active' : ''" href="/shares">
                        <i class="fas fa-folder-open me-1"></i> Шары
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'users'} ? ' active' : ''" href="/users">
                        <i class="fas fa-users me-1"></i> Пользователи
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'config'} ? ' active' : ''" href="/config">
                        <i class="fas fa-file-code me-1"></i> Конфигурация
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'global-settings'} ? ' active' : ''" href="/config/global">
                        <i class="fas fa-sliders-h me-1"></i> Настройки
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'status'} ? ' active' : ''" href="/status">
                        <i class="fas fa-heartbeat me-1"></i> Мониторинг
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <span class="navbar-host-badge" th:if="${session.sambaHost}">
                    <i class="fas fa-network-wired me-1"></i> <span th:text="${session.sambaHost}"></span>
                </span>
                <a class="btn btn-sm btn-outline-light" href="/disconnect">
                    <i class="fas fa-sign-out-alt me-1"></i> Отключиться
                </a>
            </div>
        </div>
    </div>
</nav>

<footer th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</footer>
</html>
