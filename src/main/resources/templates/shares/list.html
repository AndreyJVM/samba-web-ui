<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список шар Samba</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>📂 Список общих папок (шар)</h1>
        <div>
            <a href="/shares/create" class="btn btn-primary">➕ Добавить шару</a>
            <a href="/disconnect" class="btn btn-danger">🔌 Отключиться</a>
        </div>
    </div>

    <p>Сервер: <strong th:text="${sambaHost}"></strong></p>

    <!-- Сообщения об успехе -->
    <div th:if="${param.created}" style="color: green; background: #d4edda; padding: 10px; border-radius: 5px;">
        ✅ Шара успешно создана!
    </div>
    <div th:if="${param.updated}" style="color: green; background: #d4edda; padding: 10px; border-radius: 5px;">
        ✅ Шара успешно обновлена!
    </div>
    <div th:if="${param.deleted}" style="color: green; background: #d4edda; padding: 10px; border-radius: 5px;">
        ✅ Шара успешно удалена!
    </div>

    <!-- Таблица шар -->
    <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
        <thead style="background: #f8f9fa;">
        <tr>
            <th style="padding: 10px; text-align: left;">Имя</th>
            <th style="padding: 10px; text-align: left;">Путь</th>
            <th style="padding: 10px; text-align: left;">Комментарий</th>
            <th style="padding: 10px; text-align: center;">Только чтение</th>
            <th style="padding: 10px; text-align: center;">Гостевой доступ</th>
            <th style="padding: 10px; text-align: center;">Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="share : ${shares}" style="border-bottom: 1px solid #ddd;">
            <td style="padding: 10px;" th:text="${share.name}"></td>
            <td style="padding: 10px;" th:text="${share.path}"></td>
            <td style="padding: 10px;" th:text="${share.comment}"></td>
            <td style="padding: 10px; text-align: center;">
                <span th:if="${share.readOnly}" style="color: #dc3545;">🔒 Да</span>
                <span th:unless="${share.readOnly}" style="color: #28a745;">🔓 Нет</span>
            </td>
            <td style="padding: 10px; text-align: center;">
                <span th:if="${share.guestOk}" style="color: #28a745;">✅ Да</span>
                <span th:unless="${share.guestOk}" style="color: #6c757d;">❌ Нет</span>
            </td>
            <td style="padding: 10px; text-align: center;">
                <a th:href="@{/shares/edit/{name}(name=${share.name})}" style="margin-right: 10px;">✏️</a>
                <form th:action="@{/shares/delete/{name}(name=${share.name})}" method="post" style="display: inline;">
                    <button type="submit" style="background: none; border: none; cursor: pointer; color: #dc3545;"
                            onclick="return confirm('Удалить шару ${share.name}?')">🗑️</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${error}" style="color: red; margin-top: 20px;" th:text="${error}"></div>
</div>
</body>
</html>
