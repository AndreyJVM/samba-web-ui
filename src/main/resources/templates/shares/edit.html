<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Редактировать шару — Samba Web UI')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar('shares')}"></div>

<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-10 col-xl-8">
            <div class="card">
                <div class="card-header p-4 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold">
                        <i class="fas fa-edit text-primary me-2"></i>Редактирование: <span class="text-primary" th:text="${originalName}"></span>
                    </h5>
                    <a href="/shares" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i> Назад</a>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/shares/edit/{name}(name=${originalName})}" th:object="${share}" method="post">

                        <div class="section-title"><i class="fas fa-info-circle me-2"></i>Основная информация</div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="name" class="form-label">Имя шары <span class="text-danger">*</span></label>
                                <input type="text" id="name" th:field="*{name}" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="path" class="form-label">Путь к папке <span class="text-danger">*</span></label>
                                <input type="text" id="path" th:field="*{path}" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="comment" class="form-label">Комментарий</label>
                            <input type="text" id="comment" th:field="*{comment}" class="form-control">
                        </div>

                        <div class="section-title"><i class="fas fa-lock me-2"></i>Доступ и видимость</div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <div class="form-check form-switch mt-2">
                                    <input type="checkbox" id="readOnly" th:field="*{readOnly}" class="form-check-input">
                                    <label for="readOnly" class="form-check-label fw-bold">Только чтение</label>
                                </div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <div class="form-check form-switch mt-2">
                                    <input type="checkbox" id="guestOk" th:field="*{guestOk}" class="form-check-input">
                                    <label for="guestOk" class="form-check-label fw-bold">Гостевой доступ</label>
                                </div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <div class="form-check form-switch mt-2">
                                    <input type="checkbox" id="browseable" th:field="*{browseable}" class="form-check-input">
                                    <label for="browseable" class="form-check-label fw-bold">Видимая в сети</label>
                                </div>
                            </div>
                        </div>

                        <div class="section-title"><i class="fas fa-users-cog me-2"></i>Пользователи и права</div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="validUsers" class="form-label">Разрешенные пользователи (valid users)</label>
                                <input type="text" id="validUsers" th:field="*{validUsers}" class="form-control" placeholder="user1, @group">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="writeList" class="form-label">Право записи (write list)</label>
                                <input type="text" id="writeList" th:field="*{writeList}" class="form-control" placeholder="admin, @admins">
                            </div>
                        </div>

                        <div class="section-title"><i class="fas fa-shield-alt me-2"></i>Маски и владельцы</div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="createMask" class="form-label">Маска файлов (create mask)</label>
                                <input type="text" id="createMask" th:field="*{createMask}" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="directoryMask" class="form-label">Маска папок (directory mask)</label>
                                <input type="text" id="directoryMask" th:field="*{directoryMask}" class="form-control">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="forceUser" class="form-label">Принудительный владелец</label>
                                <input type="text" id="forceUser" th:field="*{forceUser}" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="forceGroup" class="form-label">Принудительная группа</label>
                                <input type="text" id="forceGroup" th:field="*{forceGroup}" class="form-control">
                            </div>
                        </div>

                        <div class="section-title"><i class="fas fa-network-wired me-2"></i>Сетевые фильтры</div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="maxConnections" class="form-label">Макс. сессий</label>
                                <input type="text" id="maxConnections" th:field="*{maxConnections}" class="form-control">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="hostsAllow" class="form-label">Разрешенные IP (hosts allow)</label>
                                <input type="text" id="hostsAllow" th:field="*{hostsAllow}" class="form-control">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="hostsDeny" class="form-label">Запрещенные IP (hosts deny)</label>
                                <input type="text" id="hostsDeny" th:field="*{hostsDeny}" class="form-control">
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4 pt-3 border-top">
                            <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save me-2"></i>Сохранить</button>
                            <a href="/shares" class="btn btn-outline-secondary px-4">Отмена</a>
                        </div>
                    </form>

                    <div th:if="${error}" class="alert alert-danger mt-3">
                        <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${error}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
