site_name: ShareGuard
site_description: Современный веб-интерфейс для управления сервером Samba на Spring Boot и Linux
site_author: Andrey Vorobev
repo_url: https://github.com/AndreyJVM/shareguard
repo_name: AndreyJVM/shareguard

theme:
  name: material
  language: ru
  palette:
    # Переключатель светлая/тёмная тема
    - scheme: default
      primary: black
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Включить тёмную тему
    - scheme: slate
      primary: black
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Включить светлую тему
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list

nav:
  - О проекте: index.md
  - Быстрый старт: quickstart.md
  - Локальный режим: local-mode.md
  - Временный доступ к UI: temporary-access.md
  - Подготовка сервера: server-setup.md
  - Рекомендации ФСТЭК: fstec.md
  - Архитектура: architecture.md
  - Статический анализ: static-analysis.md
