[global]
    workgroup = WORKGROUP
    server string = ShareGuard managed Samba server
    server role = standalone server
    security = user
    map to guest = Never
    server min protocol = SMB2_02
    passdb backend = tdbsam
    log file = /var/log/samba/log.smbd
    max log size = 10000
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
