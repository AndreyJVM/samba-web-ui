[global]
   workgroup = WORKGROUP
   server string = Samba Sandbox Server
   security = user
   map to guest = bad user

# ---------------------------------------------
# Тестовые данные для Frontend-разработчиков
# ---------------------------------------------

[public]
   path = /srv/samba/public
   browsable = yes
   writable = yes
   guest ok = yes
   read only = no
   comment = Публичная директория (доступна всем)

[developers_shared]
   path = /srv/samba/developers
   valid users = @developers, admin
   writable = yes
   browsable = yes
   create mask = 0770
   directory mask = 0770
   comment = Общая папка для разработчиков

[qa_testing]
   path = /srv/samba/qa
   valid users = @qa, @developers, admin
   writable = yes
   browsable = yes
   create mask = 0770
   directory mask = 0770
   comment = Директория тестирования (доступ QA и Dev)

[hr_private]
   path = /srv/samba/hr
   valid users = @hr, admin
   writable = yes
   browsable = no
   comment = Приватная директория отдела кадров (скрытая)

[finance_reports]
   path = /srv/samba/finance
   valid users = @finance, admin
   read list = @hr
   writable = yes
   browsable = yes
   comment = Финансовые отчеты (HR может только читать)
