[global]
   workgroup = WORKGROUP
   server string = Samba Sandbox Server
   security = user
   map to guest = bad user

# ---------------------------------------------
# Test mock shares for Sandbox & Frontend Dev
# ---------------------------------------------

[public]
   path = /srv/samba/public
   browsable = yes
   writable = yes
   guest ok = yes
   read only = no
   comment = Public directory (accessible to all)

[developers_shared]
   path = /srv/samba/developers
   valid users = @developers, @smb_developers, admin
   writable = yes
   browsable = yes
   create mask = 0770
   directory mask = 0770
   comment = Shared directory for developers

[qa_testing]
   path = /srv/samba/qa
   valid users = @qa, @smb_qa, @developers, @smb_developers, admin
   writable = yes
   browsable = yes
   create mask = 0770
   directory mask = 0770
   comment = QA testing directory (accessible to QA and Dev)

[hr_private]
   path = /srv/samba/hr
   valid users = @hr, @smb_hr, admin
   writable = yes
   browsable = no
   comment = Private HR department directory (hidden)

[finance_reports]
   path = /srv/samba/finance
   valid users = @finance, @smb_finance, admin
   read list = @hr, @smb_hr
   writable = yes
   browsable = yes
   comment = Financial reports (HR has read-only access)

[management]
   path = /srv/samba/management
   valid users = @managers, @smb_managers, admin
   writable = yes
   browsable = yes
   create mask = 0770
   directory mask = 0770
   comment = Management documents
