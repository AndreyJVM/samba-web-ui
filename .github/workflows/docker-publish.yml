name: Build, Push and Deploy

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'nginx/**'
      - '.github/workflows/**'

  pull_request:
    branches: [ master ]

env:
  DOCKER_IMAGE_NAME: andreyvorobevaqa/samba-web-ui

jobs:
  # ==========================================
  # JOB 1: Сборка и тестирование (Maven)
  # ==========================================
  build-and-test:
    name: Build with Maven
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build with Maven
        run: mvn clean verify
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/*.jar

  # ==========================================
  # JOB 2: Сборка Docker и пуш в Docker Hub
  # ==========================================
  docker-build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v6
        with:
          name: app-jar
          path: target/
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}

  # ==========================================
  # JOB 3: Деплой на VDS
  # ==========================================
  deploy-to-vds:
    name: Deploy to VDS via Docker Compose
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose and nginx config to VDS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          source: "docker-compose.yml,nginx/"
          target: "/home/${{ secrets.VDS_USER }}/apps/my-app/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VDS_USER }}/apps/my-app/
            docker compose pull app
            docker compose down
            docker compose up -d      
            docker system prune -f