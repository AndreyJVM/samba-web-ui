name: CI/CD Pipeline (Build, Test & Release)

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check shell script syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z -- '*.sh' packaging/deb/DEBIAN/postinst packaging/deb/DEBIAN/prerm packaging/deb/DEBIAN/postrm)

      - name: Test Python helper
        run: python3 -B -m unittest discover -s packaging/helper -p 'test_*.py' -v

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Verify Code Formatting (Spotless)
        run: ./mvnw spotless:check

      - name: Build and Test with Maven
        run: ./mvnw -B clean package

      - name: Lint frontend
        working-directory: frontend
        run: ./node/npm run lint

      - name: Build DEB package
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.1~ci.${GITHUB_RUN_NUMBER}"
          fi
          dpkg --validate-version "$version"
          jars=(target/*.jar)
          if [[ ${#jars[@]} -ne 1 || ! -f "${jars[0]}" ]]; then
            echo "Expected exactly one application JAR in target/" >&2
            exit 1
          fi
          SHAREGUARD_VERSION="$version" bash packaging/deb/build-deb.sh "${jars[0]}" dist
          dpkg-deb --info "dist/shareguard_${version}_all.deb"

      - name: Upload Built JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shareguard-jar
          path: target/*.jar
          retention-days: 7

      - name: Upload Built DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shareguard-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Built JAR
        uses: actions/download-artifact@v4
        with:
          name: shareguard-jar
          path: release-artifacts

      - name: Download Built DEB
        uses: actions/download-artifact@v4
        with:
          name: shareguard-deb
          path: release-artifacts

      - name: Generate Changelog & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/*.jar
            release-artifacts/*.deb
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-publish:
    name: Build & Publish Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Standard Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: andreyvorobevaqa/shareguard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=true

      - name: Build and push Standard Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Astra Docker metadata
        id: meta-astra
        uses: docker/metadata-action@v5
        with:
          images: andreyvorobevaqa/shareguard
          tags: |
            type=semver,pattern={{version}},prefix=astra-
            type=semver,pattern={{major}}.{{minor}},prefix=astra-
            type=raw,value=astra-latest,enable=true

      - name: Build and push Astra-compatible Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.astra
          push: true
          tags: ${{ steps.meta-astra.outputs.tags }}
          labels: ${{ steps.meta-astra.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: andreyvorobevaqa/shareguard
          readme-filepath: ./DOCKERHUB.md
