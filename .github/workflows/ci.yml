name: CI (Code Style & Tests)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  verify:
    name: Build, Spotless Check & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check Code Style (Google Java Style via Spotless)
        run: ./mvnw spotless:check

      - name: Run Tests
        run: ./mvnw test
