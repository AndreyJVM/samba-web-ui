version: '3.8'
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: samba-web-ui
    restart: unless-stopped
    ports:
      # Web UI Port
      - "8080:8080"
    environment:
      - TZ=UTC
    depends_on:
      - samba-node

  samba-node:
    build:
      context: .
      dockerfile: docker/Dockerfile.samba
    container_name: samba-node-sandbox
    restart: unless-stopped
    ports:
      # Samba / SMB Ports (mapped to alternate host ports to avoid Windows native SMB/NetBIOS conflict)
      - "1445:445"
      - "1139:139"
      # SSH Server (for direct verification if needed)
      - "2222:22"
    volumes:
      # Mount storage directories for Samba shares
      - ./data:/mnt/samba
      - ./srv:/srv
      # Keep smb.conf persisted globally
      - ./config:/etc/samba
    privileged: true
