services:
  app:
    image: andreyvorobevaqa/samba-web-ui:latest
    container_name: samba-web-ui
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Xmx256m -Xms128m
      - SAMBA_HOST=${SAMBA_HOST:-localhost}
      - SAMBA_USER=${SAMBA_USER:-root}
      - SAMBA_PASSWORD=${SAMBA_PASSWORD:-}
    ports:
      - "8081:8080"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: samba-nginx-proxy
    restart: unless-stopped
    ports:
      - "81:80"
      - "444:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge