version: '3.8'

services:
  samba-test:
    build:
      context: docker
      dockerfile: Dockerfile.samba
    image: samba-test-server:latest
    container_name: samba-sandbox
    ports:
      # Пробрасываем SSH на нестандартный порт, чтобы не конфликтовать с хостом
      - "2222:22"
      # Пробрасываем порты Samba (хотя приложение обращается локально, можно тестировать с хоста)
      - "139:139"
      - "445:445"
    volumes:
      - samba_data:/srv/samba
    # Имитируем реальную среду Linux-сервера (init system не запускаем, но нужные сервисы стартанем)
    restart: unless-stopped

volumes:
  samba_data:
    driver: local
