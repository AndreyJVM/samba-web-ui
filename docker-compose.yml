services:
  samba-nas:
    build: .
    container_name: samba-web-ui
    restart: unless-stopped
    ports:
      # Web UI
      - "8080:8080"
      # Samba / SMB Ports (mapped to alternate host ports to avoid Windows native SMB/NetBIOS conflict)
      - "1445:445"
      # SSH Server (for direct verification if needed)
      - "2222:22"
    volumes:
      # Mount storage directories for Samba shares
      - ./data:/mnt/samba
      - ./srv:/srv
      # Keep smb.conf persisted globally
      - ./config:/etc/samba
    environment:
      - TZ=UTC
    privileged: true
